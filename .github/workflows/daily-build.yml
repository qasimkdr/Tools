# Hosting: Netlify builds and deploys automatically on every push to main (see netlify.toml).
# This workflow (1) runs the build + full test suite on every push as a safety check, and
# (2) once a day triggers a fresh Netlify build so date-based pages ("90 days from today") stay correct
#     in the HTML Google sees. Needs the repo secret NETLIFY_BUILD_HOOK (Netlify → Site configuration →
#     Build & deploy → Build hooks). Without the secret the daily trigger is skipped.
name: daily-build
on:
  schedule: [{ cron: "7 0 * * *" }] # 00:07 UTC daily
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Submit ALL sitemap URLs to IndexNow (Bing) once"
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history so IndexNow can diff the pushed commits
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # 1) Test everything, including scheduled tools that are not live yet.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://mathico.xyz' }}
          SHOW_SCHEDULED: "1"
      - run: npx playwright install --with-deps chromium && npx playwright test
      # 2) Production view (what Netlify serves now): no live page may link to a hidden tool.
      - run: npm run build && node scripts/check-links.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://mathico.xyz' }}
      # IndexNow (Bing etc.; Google ignores it): after tests pass, tell Bing which pages changed in this push.
      - name: IndexNow (changed pages)
        if: ${{ github.event_name == 'push' }}
        run: node scripts/indexnow.mjs --changed "${{ github.event.before }}" "${{ github.sha }}" --wait
      - name: IndexNow (all pages, manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.indexnow_all }}
        run: node scripts/indexnow.mjs --all --wait
  daily-rebuild:
    needs: test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Netlify build hook (skipped on days a scheduled tool publishes later; that build refreshes everything)
        env: { HOOK: "${{ secrets.NETLIFY_BUILD_HOOK }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "NETLIFY_BUILD_HOOK secret not set; skipping."; exit 0; fi
          later_today=$(node -e '
            const fs = require("fs"), path = require("path"), now = Date.now();
            const pkt = (t) => new Date(t + 5 * 3600e3).toISOString().slice(0, 10);
            let hit = false;
            for (const s of fs.readdirSync("src/tools")) {
              const f = path.join("src/tools", s, "meta.ts");
              if (!fs.existsSync(f)) continue;
              const at = fs.readFileSync(f, "utf8").match(/publishAt:\s*"([^"]+)"/)?.[1];
              if (at && Date.parse(at) > now && pkt(Date.parse(at)) === pkt(now)) hit = true;
            }
            process.stdout.write(hit ? "yes" : "no");')
          if [ "$later_today" = "yes" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "A tool publishes later today: skipping the morning rebuild."; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK"
