# Hosting: Netlify builds and deploys automatically on every push to main (see netlify.toml).
# This workflow (1) runs the build + full test suite on every push as a safety check, and
# (2) once a day triggers a fresh Netlify build so date-based pages ("90 days from today") stay correct
#     in the HTML Google sees. Needs the repo secret NETLIFY_BUILD_HOOK (Netlify → Site configuration →
#     Build & deploy → Build hooks). Without the secret the daily trigger is skipped.
name: daily-build
on:
  schedule: [{ cron: "7 0 * * *" }] # 00:07 UTC daily
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Submit ALL sitemap URLs to IndexNow (Bing) once"
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history so IndexNow can diff the pushed commits
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://mathico.xyz' }}
      - run: npx playwright install --with-deps chromium && npx playwright test
      # IndexNow (Bing etc.; Google ignores it): after tests pass, tell Bing which pages changed in this push.
      - name: IndexNow (changed pages)
        if: ${{ github.event_name == 'push' }}
        run: node scripts/indexnow.mjs --changed "${{ github.event.before }}" "${{ github.sha }}" --wait
      - name: IndexNow (all pages, manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.indexnow_all }}
        run: node scripts/indexnow.mjs --all --wait
  daily-rebuild:
    needs: test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env: { HOOK: "${{ secrets.NETLIFY_BUILD_HOOK }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "NETLIFY_BUILD_HOOK secret not set; skipping."; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK"
